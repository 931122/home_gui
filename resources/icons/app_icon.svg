<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 背景流光渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- 核心光晕渐变 -->
    <radialGradient id="centerGlow" cx="50%" cy="54%" r="48%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bottomGlow" cx="50%" cy="90%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- 房屋轮廓主渐变 (青蓝至翠绿) -->
    <linearGradient id="homeStrokeGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- 核心圆环渐变 -->
    <linearGradient id="coreRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- 核心光核渐变 -->
    <radialGradient id="coreFillGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#7dd3fc"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>

    <!-- 顶部玻璃反光 -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- 柔和阴影滤镜 -->
    <filter id="hubShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0284c7" flood-opacity="0.45"/>
    </filter>

    <filter id="coreGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. 纯黑深邃背景 -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>

  <!-- 2. 环境氛围光 -->
  <circle cx="512" cy="550" r="420" fill="url(#centerGlow)"/>
  <circle cx="512" cy="850" r="380" fill="url(#bottomGlow)"/>

  <!-- 3. 背景科技同心圆环 -->
  <circle cx="512" cy="590" r="330" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.16" stroke-dasharray="8 12"/>
  <circle cx="512" cy="590" r="230" fill="none" stroke="#67e8f9" stroke-width="2" stroke-opacity="0.22"/>

  <!-- 4. 智能家居主体轮廓 (屋宇科技造型) -->
  <g filter="url(#hubShadow)">
    <!-- 房屋主屋顶与外墙 -->
    <!-- 尖顶 (512, 210), 屋檐左 (220, 440), 屋檐右 (804, 440), 墙底左 (260, 780), 墙底右 (764, 780) -->
    <path d="M 512 210
             L 810 440
             L 760 440
             L 760 760
             C 760 782 742 800 720 800
             L 304 800
             C 282 800 264 782 264 760
             L 264 440
             L 214 440
             Z"
          fill="none"
          stroke="url(#homeStrokeGrad)"
          stroke-width="36"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- 科技屋檐加固装饰线 -->
    <path d="M 330 380 L 512 245 L 694 380"
          fill="none"
          stroke="#67e8f9"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-opacity="0.55"/>

    <!-- 5. 房屋核心中控总线 (智能能量环 + 信号波束) -->
    <!-- 向上辐射线束 (连接尖顶) -->
    <line x1="512" y1="475" x2="512" y2="330"
          stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-opacity="0.70" stroke-dasharray="6 8"/>

    <!-- 屋顶能量核心节点 -->
    <circle cx="512" cy="310" r="16" fill="#38bdf8" filter="url(#coreGlowFilter)"/>
    <circle cx="512" cy="310" r="7" fill="#ffffff"/>

    <!-- 左右科技节点 -->
    <circle cx="340" cy="590" r="12" fill="#06b6d4" stroke="#ffffff" stroke-width="3" stroke-opacity="0.8"/>
    <line x1="360" y1="590" x2="415" y2="590" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-opacity="0.5"/>

    <circle cx="684" cy="590" r="12" fill="#10b981" stroke="#ffffff" stroke-width="3" stroke-opacity="0.8"/>
    <line x1="609" y1="590" x2="664" y2="590" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-opacity="0.5"/>

    <!-- 中央中控外环 (脉冲中枢) -->
    <circle cx="512" cy="590" r="95"
            fill="#0b172a"
            fill-opacity="0.85"
            stroke="url(#coreRingGrad)"
            stroke-width="16"/>

    <!-- 中枢刻度环 -->
    <circle cx="512" cy="590" r="68"
            fill="none"
            stroke="#67e8f9"
            stroke-width="4"
            stroke-linecap="round"
            stroke-dasharray="16 12"
            stroke-opacity="0.75"/>

    <!-- 核心光球 (高亮智慧之核) -->
    <circle cx="512" cy="590" r="38" fill="url(#coreFillGrad)" filter="url(#coreGlowFilter)"/>
    <circle cx="500" cy="578" r="10" fill="#ffffff" fill-opacity="0.85"/>

    <!-- 底部连接桥墩 (门厅稳固基座) -->
    <path d="M 432 800 L 432 710 C 432 688 450 670 472 670 L 552 670 C 574 670 592 688 592 710 L 592 800"
          fill="none"
          stroke="url(#homeStrokeGrad)"
          stroke-width="20"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- 6. 顶部微妙玻璃镜面高光反射 -->
  <path d="M 0 0 L 1024 0 L 1024 450 Q 512 600 0 450 Z" fill="url(#glassSheen)"/>
</svg>

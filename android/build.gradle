buildscript {
    repositories {
        google()
        mavenCentral()
        jcenter()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:3.6.0'
    }
}

repositories {
    google()
    mavenCentral()
    jcenter()
}

apply plugin: 'com.android.application'

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.6.0'
    }
}

android {
    compileSdkVersion androidCompileSdkVersion.toInteger()
    buildToolsVersion '28.0.3'

    def resolvedQtAndroidDir = project.hasProperty('qtAndroidDir') ? qtAndroidDir : ''

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [resolvedQtAndroidDir + '/src', 'src', 'java']
            aidl.srcDirs = [resolvedQtAndroidDir + '/src', 'src', 'aidl']
            res.srcDirs = [resolvedQtAndroidDir + '/res', 'res']
            resources.srcDirs = ['resources']
            renderscript.srcDirs = ['src']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
       }
    }

    tasks.withType(JavaCompile) {
        options.incremental = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false
    }

    // Do not compress Qt binary resources file
    aaptOptions {
        noCompress 'rcc'
    }

    defaultConfig {
        resConfig "en"
        minSdkVersion = 21
        targetSdkVersion = qtTargetSdkVersion
    }

    packagingOptions {
        exclude 'lib/arm64-v8a/libqml_QtQuick_Controls.2_Imagine_*'
        exclude 'lib/arm64-v8a/libqml_QtQuick_Controls.2_Universal_*'
        exclude 'lib/arm64-v8a/libqml_QtQuick_Controls.2_Fusion_*'
        exclude 'lib/arm64-v8a/libqml_QtQuick_Controls.2_Material_*'
    }
}
